services:

  nginx:
    image: nginx:latest
    container_name: nexus-nginx
    restart: unless-stopped

    ports:
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro

    networks:
      - nexus-network


networks:
  nexus-network:
    external: true
